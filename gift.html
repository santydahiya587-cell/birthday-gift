<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Birthday Gift 🎁</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .gift-container {
      width: min(90vw, 550px);
      height: 300px;
      position: relative;
      cursor: pointer;
    }

    /* Gift Box */
    .gift {
      width: 100%;
      height: 180px;
      position: absolute;
      bottom: 20px;
      background: #ff3f86;
      border-radius: 0 0 35px 35px;
      box-shadow: 0 10px 30px rgba(255, 0, 100, 0.4);
    }

    /* Vertical ribbon */
    .gift::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 100%;
      background: #f4faff;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Horizontal ribbon */
    .gift::after {
      content: "";
      position: absolute;
      height: 22px;
      width: 100%;
      background: #f4faff;
      top: 50%;
      transform: translateY(-50%);
    }

    /* Lid */
    .lid {
      width: 100%;
      height: 70px;
      position: absolute;
      top: 30px;
      background: #ff3f86;
      border-radius: 35px;
      z-index: 3;

      transition: transform 0.8s ease;
    }

    /* Lid ribbons */
    .lid::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 100%;
      background: #f4faff;
      left: 50%;
      transform: translateX(-50%);
    }

    .lid::after {
      content: "";
      position: absolute;
      height: 22px;
      width: 100%;
      background: #f4faff;
      top: 50%;
      transform: translateY(-50%);
    }

    /* Bow */
    .bow {
      position: absolute;
      width: 70px;
      height: 40px;
      background: #e9f6ff;
      border-radius: 50%;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .bow::before,
    .bow::after {
      content: "";
      position: absolute;
      width: 45px;
      height: 55px;
      background: #e9f6ff;
      top: -8px;
      border-radius: 50%;
    }

    .bow::before {
      left: -30px;
      transform: rotate(-25deg);
    }

    .bow::after {
      right: -30px;
      transform: rotate(25deg);
    }

    /* Message */
    .message {
      position: absolute;
      width: 90%;
      left: 5%;
      top: 30px;
      text-align: center;
      color: white;
      opacity: 0;
      transform: translateY(30px);
      transition: 0.8s ease;
      z-index: 1;
    }

    .message h1 {
      font-size: clamp(24px, 6vw, 42px);
      margin: 0 0 10px;
    }

    .message p {
      font-size: clamp(15px, 4vw, 20px);
      margin: 0;
    }

    /* Open animation */
    .gift-container.open .lid {
      transform: translateY(-130px) rotate(-5deg);
    }

    .gift-container.open .bow {
      opacity: 0;
    }

    .gift-container.open .message {
      opacity: 1;
      transform: translateY(-20px);
    }

    .hint {
      position: absolute;
      bottom: -25px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="gift-container" onclick="openGift()">

    <div class="message">
      <h1>🎉 Happy Birthday! 🎂</h1>
      <p>Wishing you lots of happiness and beautiful memories ❤️</p>
    </div>

    <div class="gift">
    </div>

    <div class="lid">
      <div class="bow"></div>
    </div>

    <div class="hint">
      Tap the gift 🎁
    </div>

  </div>

  <script>
    function openGift() {
      document
        .querySelector(".gift-container")
        .classList.toggle("open");
    }
  </script>

</body>
</html>
